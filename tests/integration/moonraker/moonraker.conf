[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /tmp/klippy_uds

# Only the container itself is trusted, so the tests reach it from outside as an untrusted host.
[authorization]
trusted_clients:
  127.0.0.0/8
cors_domains:
  *

# Job history, which the bridge logs prints from.
[history]

[machine]
provider: none
validate_service: False
