configuration:
  printers:
    name: Printers
    description: >-
      The printers to watch, one entry each. Every printer needs a name and an adapter; the
      other fields depend on the adapter (see the Documentation tab).
    fields:
      name:
        name: Name
        description: Your name for the printer, shown in the log (letters, digits, spaces).
      adapter:
        name: Adapter
        description: >-
          moonraker for Klipper printers (Voron, Snapmaker U1, Creality K1/K2...), bambu for
          Bambu Lab printers, prusalink for Prusa printers, octoprint for printers run by
          OctoPrint, sdcp for the Elegoo Centauri Carbon, duet for Duet boards
          (RepRapFirmware), flashforge for the FlashForge Adventurer 5M series and AD5X,
          anycubic for Anycubic printers in LAN mode (Kobra S1, Kobra 3, Photon P1).
      printer_id:
        name: Printer ID
        description: >-
          The printer's number in 3D Print Log, the end of its page's address
          (www.3dprintlog.com/printers/42). After pairing, the log lists your printers with
          their numbers.
      url:
        name: URL
        description: >-
          moonraker: the printer's Moonraker address, such as http://192.168.1.20:7125.
          octoprint: OctoPrint's address, such as http://octopi.local.
      host:
        name: Host
        description: >-
          bambu, prusalink, sdcp, duet, flashforge, anycubic: the printer's IP address or host
          name.
      serial:
        name: Serial number
        description: "bambu, flashforge: the printer's serial number."
      access_code:
        name: Access code
        description: "bambu: the LAN access code on the printer's screen."
      check_code:
        name: Check code
        description: >-
          flashforge: the check code on the printer's screen (Settings > Network, with LAN-only
          mode on).
      password:
        name: Printer password
        description: >-
          prusalink: the password in the printer's Settings > Network > PrusaLink. duet: the
          board's password (M551 in config.g), only when it has one.
      api_key:
        name: Printer API key
        description: >-
          moonraker: Moonraker's API key, only when its [authorization] doesn't trust this
          host. prusalink: the API key of older firmware, instead of a password. octoprint: a key
          from OctoPrint's Settings > Application Keys.
      username:
        name: PrusaLink user
        description: "prusalink: the user, when it isn't maker."
  device_name:
    name: Device name
    description: >-
      The name 3D Print Log shows for this bridge once paired (default: printlog-bridge on
      <your Home Assistant's host name>).
  api_key:
    name: 3D Print Log API key
    description: >-
      Leave empty to pair instead: the bridge shows a QR code in the Log tab on its first start.
      Or a personal API key from www.3dprintlog.com/api-keys.
  api_url:
    name: 3D Print Log API
    description: Leave empty. Only for testing against another 3D Print Log server (https).
  trace:
    name: Trace
    description: >-
      Record every message to and from each Moonraker printer in the app's data, secrets
      removed, to report a problem. Leave off otherwise.
