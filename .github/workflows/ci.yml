name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is Raspberry Pi OS Bullseye's Python, the oldest we support.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck install.sh uninstall.sh tests/install/smoke.sh tests/docker/smoke.sh

  install-smoke:
    # A clean install from the source tree in the image people will run, without dev tools.
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      # git first, so the checkout is a real clone, as install.sh expects for Moonraker updates.
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pip install .
      - run: printlog-bridge --version
      - name: doctor runs and reports a missing config
        run: |
          set +e
          printlog-bridge doctor --config /nonexistent.cfg > out.txt
          code=$?
          cat out.txt
          test "$code" -eq 1 && grep -q "FAIL  Config" out.txt
      - name: install.sh and uninstall.sh, against a fake systemctl
        run: bash tests/install/smoke.sh

  integration:
    # The bridge against a real Moonraker (no Klipper) in Docker. See tests/integration/.
    name: integration (Moonraker ${{ matrix.moonraker.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        moonraker:
          # The last release, which older printer firmware (Creality, Snapmaker) is closest to,
          # and a recent master commit. Bump the commit deliberately; a test failing here means
          # Moonraker changed something the bridge or tests/fake_moonraker.py relies on.
          - { name: v0.9.3, ref: v0.9.3 }
          - { name: master 2026-10, ref: 9e676eba6b02661a4dfa3ec6e7ac3f3504498e6d }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m integration -v
        env:
          MOONRAKER_REF: ${{ matrix.moonraker.ref }}
