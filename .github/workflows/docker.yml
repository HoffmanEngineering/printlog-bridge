name: Docker

# The remote-mode image, ghcr.io/hoffmanengineering/printlog-bridge, for linux/amd64, linux/arm64
# and linux/arm/v7. Every push to main publishes `edge`; a v1.2.3 tag publishes 1.2.3, 1.2 and
# latest. Pull requests build every platform without pushing, after the same smoke test.
#
# The Home Assistant app's image, ghcr.io/hoffmanengineering/printlog-bridge-addon (the
# Dockerfile's addon stage, home-assistant/), is built, smoke-tested and published alongside it
# with the same tags, for linux/amd64 and linux/arm64 only: Home Assistant dropped 32-bit Arm.
# The Supervisor pulls the tag equal to home-assistant/config.yaml's version.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hoffmanengineering/printlog-bridge
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  ADDON_IMAGE: ghcr.io/hoffmanengineering/printlog-bridge-addon
  ADDON_PLATFORMS: linux/amd64,linux/arm64

jobs:
  smoke:
    # Builds the image for each platform and runs version, store-key, doctor, run and status
    # inside it, against fakes on the runner (tests/docker/smoke.sh). Nothing calls the real API.
    # arm64 (a Pi 4 or 5 on 64-bit Raspberry Pi OS) runs natively on GitHub's Arm runner; arm/v7
    # (32-bit Raspberry Pi OS) runs under QEMU. The main branch's ruleset requires a check called
    # `smoke`, so the amd64 leg keeps that name.
    name: ${{ matrix.platform == 'linux/amd64' && 'smoke' || format('smoke ({0})', matrix.platform) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, cache: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, cache: arm64 }
          - { platform: linux/arm/v7, runner: ubuntu-latest, cache: armv7, qemu: true }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.qemu
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: printlog-bridge:smoke
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "aiohttp>=3.8" # for the fakes
      - run: bash tests/docker/smoke.sh printlog-bridge:smoke "${{ matrix.platform }}"
      # The app's image: the same layers plus the addon stage.
      - if: matrix.platform != 'linux/arm/v7'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: addon
          platforms: ${{ matrix.platform }}
          load: true
          tags: printlog-bridge-addon:smoke
          cache-from: type=gha,scope=${{ matrix.cache }}
      - if: matrix.platform != 'linux/arm/v7'
        run: bash tests/docker/addon_smoke.sh printlog-bridge-addon:smoke "${{ matrix.platform }}"

  build:
    # Pull requests (forks included) build every platform and push nothing, with no registry
    # access: this job has only the workflow's read-only token.
    if: github.event_name == 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: printlog-bridge:pr
          cache-from: type=gha,scope=multiarch
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: addon
          platforms: ${{ env.ADDON_PLATFORMS }}
          push: false
          tags: printlog-bridge-addon:pr
          cache-from: type=gha,scope=multiarch

  publish:
    # The only job that can write to GHCR, and it never runs for a pull request.
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }} # edge, or 1.2.3 for a v1.2.3 tag
      addon_tag: ${{ steps.addon-meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Put the description on the multi-arch index too, where GHCR's package page reads it.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # latest comes only with a release tag (not a pre-release), never from main.
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=printlog-bridge
            org.opencontainers.image.description=Logs every Klipper/Moonraker print to 3D Print Log automatically.
          annotations: |
            org.opencontainers.image.description=Logs every Klipper/Moonraker print to 3D Print Log automatically.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
      - id: addon-meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.ADDON_IMAGE }}
          flavor: latest=auto
          # The same tags: a v1.2.3 tag publishes 1.2.3, the version Home Assistant pulls.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=printlog-bridge-addon
            org.opencontainers.image.description=The printlog-bridge Home Assistant app: logs every print to 3D Print Log.
          annotations: |
            org.opencontainers.image.description=The printlog-bridge Home Assistant app: logs every print to 3D Print Log.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: addon
          platforms: ${{ env.ADDON_PLATFORMS }}
          push: true
          tags: ${{ steps.addon-meta.outputs.tags }}
          labels: ${{ steps.addon-meta.outputs.labels }}
          annotations: ${{ steps.addon-meta.outputs.annotations }}
          cache-from: type=gha,scope=multiarch

  verify:
    # Checks what was just published the way someone without a GitHub account sees it: it pulls
    # without logging in, has every platform, and each one starts. GHCR makes a new package
    # private, so this fails until the package is made public (printlog-bridge and
    # printlog-bridge-addon alike).
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - run: bash tests/docker/check_published.sh "${{ env.IMAGE }}:${{ needs.publish.outputs.tag }}"
      - run: bash tests/docker/check_published.sh "${{ env.ADDON_IMAGE }}:${{ needs.publish.outputs.addon_tag }}"
        env:
          PLATFORMS: ${{ env.ADDON_PLATFORMS }}

  release-script:
    # The one-line install (README "One-line install with Docker") downloads
    # releases/latest/download/docker-install.sh: attach it to the tag's GitHub release (made
    # here when there isn't one), with DEFAULT_TAG set to this release's version, so the copy a
    # user runs installs the image released with it and only changes with a release, plus its
    # SHA-256 for those who check it. Only after verify, so the image it names can be pulled.
    # tests/install/docker_install_smoke.sh runs the same sed. Any failure fails the job.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: attach
        name: Attach docker-install.sh and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          sed "s/^DEFAULT_TAG=latest\$/DEFAULT_TAG=${VERSION}/" scripts/docker-install.sh >dist/docker-install.sh
          grep -qx "DEFAULT_TAG=${VERSION}" dist/docker-install.sh
          (cd dist && sha256sum docker-install.sh >docker-install.sh.sha256)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $prerelease
          fi
          gh release upload "$TAG" dist/docker-install.sh dist/docker-install.sh.sha256 --clobber
          echo "prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" >>"$GITHUB_OUTPUT"
      - name: The one-line install's address serves this release's script
        # A prerelease is never releases/latest, so only a release is checked.
        if: steps.attach.outputs.prerelease == 'false'
        env:
          BASE: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          set -euo pipefail
          cd dist
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o served.sh "$BASE/docker-install.sh"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o served.sha256 "$BASE/docker-install.sh.sha256"
          cmp served.sh docker-install.sh
          cmp served.sha256 docker-install.sh.sha256
          sha256sum -c docker-install.sh.sha256
