name: Docker

# The remote-mode image, ghcr.io/hoffmanengineering/printlog-bridge, for linux/amd64, linux/arm64
# and linux/arm/v7. Every push to main publishes `edge`; a v1.2.3 tag publishes 1.2.3, 1.2 and
# latest. Pull requests build every platform without pushing, after the same smoke test.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hoffmanengineering/printlog-bridge
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  smoke:
    # Builds the amd64 image and runs version, store-key, doctor, run and status inside it,
    # against fakes on the runner (tests/docker/smoke.sh). Nothing calls the real API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: printlog-bridge:smoke
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "aiohttp>=3.8" # for the fakes
      - run: bash tests/docker/smoke.sh printlog-bridge:smoke

  build:
    # Pull requests (forks included) build every platform and push nothing, with no registry
    # access: this job has only the workflow's read-only token.
    if: github.event_name == 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: printlog-bridge:pr
          cache-from: type=gha,scope=multiarch

  publish:
    # The only job that can write to GHCR, and it never runs for a pull request.
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          # Put the description on the multi-arch index too, where GHCR's package page reads it.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # latest comes only with a release tag (not a pre-release), never from main.
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=printlog-bridge
            org.opencontainers.image.description=Logs every Klipper/Moonraker print to 3D Print Log automatically.
          annotations: |
            org.opencontainers.image.description=Logs every Klipper/Moonraker print to 3D Print Log automatically.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
