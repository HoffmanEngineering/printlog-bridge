# printlog-bridge config. Copy to ~/printer_data/config/printlog-bridge.cfg
# (local mode, next to printer.cfg) or ~/.config/printlog-bridge/printlog-bridge.cfg.
# Check it with: printlog-bridge doctor

[bridge]
# A personal API key from https://www.3dprintlog.com/api-keys. Pairing will replace this.
# Don't put it here: store it with `printlog-bridge store-key`, which keeps it in api_key in
# state_dir, readable only by you. Moonraker serves Klipper's config folder (where this file
# sits in local mode) to anyone who can open Mainsail or Fluidd. The PRINTLOG_API_KEY
# environment variable, then that file, win over api_key here.
api_key =
# api_url = https://api.3dprintlog.com
# Testing against a development API on another computer on your network (plain http to a
# private IP address only; the API key then travels unencrypted on your LAN):
# allow_http_on_lan = true
# state_dir = ~/.local/share/printlog-bridge
# Record every message to and from each printer's Moonraker in state_dir/traces, secrets
# removed, to report a problem or turn a print into a test. Stays on this computer.
# PRINTLOG_BRIDGE_TRACE=1 does the same (for Docker).
# trace = false
# When a print starts and you already made its print yourself (the Slic3r uploader, the Cura
# plugin, or by hand), log the job to it instead of a new one: a print in Printing on the
# same printer, for the same file, made within adopt_window (12h, 90m, 2d). These three can
# also go in a [printer] section for that printer only.
# adopt_prints = true
# adopt_window = 12h
# Finish-only mode, for uploader users: never create a print; a job with no print of yours
# to adopt isn't logged.
# create_prints = true
# The largest file attached to a print (a timelapse video, with Pro), in MB, up to 200:
# max_attachment_mb = 100

# One section per printer. The name is yours; it appears in logs and doctor.
# printer_id is the printer's number in 3D Print Log: the end of its page's address,
# such as https://www.3dprintlog.com/printers/42. Prints from this printer are logged there.

# Local mode: the bridge runs on the printer's own host.
[printer voron]
# printer_id = 42
# adapter = moonraker
# socket = ~/printer_data/comms/moonraker.sock
# Add a frame from the printer's webcam to each print when it ends (on by default):
# snapshots = true
# With moonraker-timelapse and 3D Print Log Pro, attach each print's video to it (on by
# default; without Pro, nothing is uploaded):
# timelapse = true

# Remote mode: the bridge runs elsewhere on the network (e.g. the Snapmaker U1).
# [printer u1]
# printer_id = 43
# url = http://u1.local:7125
# Only if Moonraker has [authorization] on and this host isn't in its trusted_clients:
# moonraker_api_key = ...
# Find the printer again if its IP address changes (on by default). `printlog-bridge discover`
# lists the Moonraker printers on your network.
# discovery = true
# How long the printer must be unreachable before it's looked for, and the least time between
# two searches (90s, 3m, 1h...):
# discovery_after = 3m
# discovery_interval = 10m
# How long to wait for each address to answer (raise it for a slow Wi-Fi network):
# discovery_timeout = 2s
# Ask over zeroconf (mDNS) before scanning (needs host networking in Docker):
# discovery_zeroconf = true
# Where to look, instead of the /24 around the printer's last address: private networks
# of a /24 or smaller, up to 16, such as a printer VLAN:
# discovery_networks = 192.168.1.0/24, 192.168.20.0/24
