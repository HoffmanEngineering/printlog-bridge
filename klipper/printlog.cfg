# printlog-bridge macros: tell 3D Print Log which spool is in each tool.
# https://github.com/HoffmanEngineering/printlog-bridge
#
# Include this file from printer.cfg with [include printlog.cfg] (install.sh does it for you),
# then restart Klipper. In the console, or in a macro:
#
#   PRINTLOG_SET_SPOOL TOOL=2 TAG=04A23F11   T2 has the spool with this RFID/NFC tag
#   PRINTLOG_SET_SPOOL ID=<spool id>         the active tool has this spool (its id is on the
#                                            spool's page in 3D Print Log)
#   PRINTLOG_CLEAR_SPOOL TOOL=1              T1 has no spool
#
# TOOL is the tool's number: 0 for T0 or a single-tool printer, 1 for T1, and so on. Left out,
# it is the active tool.
#
# The macros only print a line to the console. printlog-bridge reads it, assigns the spool in
# 3D Print Log, and answers on the console. So a macro never fails, and never stops a print,
# even when the bridge is offline; if no answer comes, the bridge didn't hear it, and running
# it again once the bridge is back does. Assign spools before a print starts: the print takes
# the spools loaded when it begins (change a print's spool in the app afterwards).
#
# install.sh keeps this file up to date unless you change it. To change a macro, copy it into
# your own config under another name.

[gcode_macro PRINTLOG_SET_SPOOL]
description: Assign a 3D Print Log spool to a tool: PRINTLOG_SET_SPOOL [TOOL=n] ID=<spool id> or TAG=<tag uid>
gcode:
  {% set active = printer.toolhead.extruder|default("extruder")|string %}
  {% set tool = params.TOOL|default(active[8:] or "0")|string %}
  {% if not tool.isdigit() %}
    {action_respond_info("PRINTLOG_SET_SPOOL: TOOL must be a tool number, such as TOOL=0 for T0")}
  {% elif params.ID is defined and params.TAG is not defined %}
    {action_respond_info("printlog: SET_SPOOL TOOL=%s ID=%s" % (tool, params.ID))}
    {action_respond_info("PRINTLOG_SET_SPOOL: sent to printlog-bridge, which answers here")}
  {% elif params.TAG is defined and params.ID is not defined %}
    {action_respond_info("printlog: SET_SPOOL TOOL=%s TAG=%s" % (tool, params.TAG))}
    {action_respond_info("PRINTLOG_SET_SPOOL: sent to printlog-bridge, which answers here")}
  {% else %}
    {action_respond_info("PRINTLOG_SET_SPOOL: name the spool with ID=<spool id> or TAG=<tag uid>")}
  {% endif %}

[gcode_macro PRINTLOG_CLEAR_SPOOL]
description: Tell 3D Print Log a tool has no spool: PRINTLOG_CLEAR_SPOOL [TOOL=n]
gcode:
  {% set active = printer.toolhead.extruder|default("extruder")|string %}
  {% set tool = params.TOOL|default(active[8:] or "0")|string %}
  {% if not tool.isdigit() %}
    {action_respond_info("PRINTLOG_CLEAR_SPOOL: TOOL must be a tool number, such as TOOL=0 for T0")}
  {% else %}
    {action_respond_info("printlog: CLEAR_SPOOL TOOL=%s" % (tool,))}
    {action_respond_info("PRINTLOG_CLEAR_SPOOL: sent to printlog-bridge, which answers here")}
  {% endif %}

[gcode_macro _PRINTLOG_RESPOND]
description: Shows printlog-bridge's answer on the console
gcode:
  {action_respond_info(params.MSG|default("")|string)}
