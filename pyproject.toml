[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "printlog-bridge"
dynamic = ["version"]
description = "Logs every Klipper/Moonraker print to 3D Print Log automatically."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hoffman Engineering" }]
# Raspberry Pi OS Bullseye ships Python 3.9, and it is still on a lot of printers.
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8",
    # Opens the LAN credentials sealed to the bridge in the app (core/credentials.py). Only
    # where PyPI has wheels for it and for cffi, so no install compiles anything; elsewhere the
    # bridge runs without it. On 32-bit Arm (cryptography has a wheel, cffi doesn't) install.sh
    # and the Docker image add it themselves.
    "cryptography>=3.1; platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'AMD64' or platform_machine == 'arm64'",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout>=2", "ruff>=0.5", "jinja2>=3", "segno>=1.5", "pyyaml>=5.4"]
# jinja2 renders klipper/printlog.cfg in tests; segno checks core/qr.py in tests (never at runtime);
# pyyaml reads the Home Assistant app's config.yaml in tests; pytest-timeout ends a hung
# integration test (tests/integration/conftest.py) and names it

[project.scripts]
printlog-bridge = "printlog_bridge.cli.main:run"
printlog-bridge-health = "printlog_bridge.cli.health:run"
printlog-bridge-addon = "printlog_bridge.cli.addon:run"

[project.urls]
Homepage = "https://www.3dprintlog.com"
Source = "https://github.com/HoffmanEngineering/printlog-bridge"

[tool.setuptools.dynamic]
version = { attr = "printlog_bridge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests start a real Moonraker in Docker: `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: runs against a real Moonraker in Docker (needs Docker)"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
